[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-forecast-platform"
version = "0.1.0"
description = "Reproducible retail sales forecasting and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["packages/forecasting/src"]

[project.optional-dependencies]
dev = ["ruff==0.17.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]